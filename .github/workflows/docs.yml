name: Docs

# Build the Sphinx site and deploy it to GitHub Pages.
on:
  push:
    branches: [main]          # change if your default branch differs
  workflow_dispatch:           # allows a manual run from the Actions tab

# Permissions the Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        # If the Sphinx project is in a sub-folder, add:
        #   working-directory: docs

      - name: Build HTML
        run: sphinx-build -b html . _build/html
        # working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html          # path to the built site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
